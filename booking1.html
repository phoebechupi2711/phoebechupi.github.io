<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快捷按鈕控制板</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary-color: #059669;
      --secondary-hover: #047857;
      --accent-color: #d97706;
      --accent-hover: #b45309;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      color: #1e293b;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* 按鈕顏色樣式 */
    .btn-setting {
      background-color: var(--primary-color);
    }
    .btn-setting:hover {
      background-color: var(--primary-hover);
    }

    .btn-test {
      background-color: var(--secondary-color);
    }
    .btn-test:hover {
      background-color: var(--secondary-hover);
    }

    .btn-sync {
      background-color: var(--accent-color);
    }
    .btn-sync:hover {
      background-color: var(--accent-hover);
    }

    /* 響應式微調 (平板與大螢幕) */
    @media (min-width: 640px) {
      .container {
        max-width: 540px;
        padding: 48px 40px;
      }
      
      .btn {
        font-size: 1.15rem;
        padding: 16px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>控制面板</h1>
    <div class="button-group">
      
      <!-- 測試 (n8n 表單) -->
      <a href="https://petetian.app.n8n.cloud/form/4e4ee51d-7dda-4957-a78b-60b916e31706" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="btn btn-test">
        設定公休日
      </a>

      <!-- 同步 (預設為 Google 試算表，可依需求自行替換) -->
      <a href="https://phoebechupi2711.github.io/phoebechupi.github.io/off_days_viewer.html" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="btn btn-sync">
        同步
      </a>
    </div>
  </div>

</body>
</html>
